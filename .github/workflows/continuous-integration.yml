name: CI

on:
  - push

permissions: { }

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: christophgietl/uv-actions/set-up-uv@83513e97a94eb488fb9b2500d4585f65e19eab4a # 2026.7.21.12
      - run: uv build --verbose
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: christophgietl/uv-actions/set-up-uv@83513e97a94eb488fb9b2500d4585f65e19eab4a # 2026.7.21.12
        with:
          install-and-cache-dependencies: true
      - uses: christophgietl/uv-actions/set-up-pre-commit@83513e97a94eb488fb9b2500d4585f65e19eab4a # 2026.7.21.12
        with:
          cache-key-suffix: ${{ matrix.os }}
      - run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest
