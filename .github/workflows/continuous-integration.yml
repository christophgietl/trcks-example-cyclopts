name: CI

on:
  - push

permissions: { }

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: christophgietl/uv-actions/set-up-uv@d231379b0f63cd19bc39d7e5b4d5057a2daffc17 # 2026.8.24
      - run: uv build --verbose
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: christophgietl/uv-actions/set-up-uv@d231379b0f63cd19bc39d7e5b4d5057a2daffc17 # 2026.8.24
        with:
          install-and-cache-dependencies: true
      - uses: christophgietl/uv-actions/set-up-pre-commit@d231379b0f63cd19bc39d7e5b4d5057a2daffc17 # 2026.8.24
        with:
          cache-key-suffix: ${{ matrix.os }}
      - env:
          # The agent skills installed via `library-skills` are symlinks with
          # POSIX-style targets, so this agent setup is POSIX-only and the
          # check-symlinks and destroyed-symlinks hooks cannot pass on Windows.
          SKIP: ${{ runner.os == 'Windows' && 'check-symlinks,destroyed-symlinks' || '' }}
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure
      - run: uv run --no-sync pyrefly check
      - run: uv run --no-sync pytest
